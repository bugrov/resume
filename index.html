<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="color-scheme" content="light dark" />

    <title>Александр Бугров — Fullstack-разработчик</title>
    <meta
      name="description"
      content="Александр Бугров — Fullstack-разработчик. Vue.js, Nuxt.js, React, Next.js, Node.js, NestJS, PHP. 6+ лет коммерческой разработки, опыт архитектуры и поддержки крупных проектов."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Александр Бугров — Fullstack-разработчик" />
    <meta
      property="og:description"
      content="Vue.js, Nuxt.js, React, Next.js, Node.js, NestJS, PHP. 6+ лет коммерческой разработки."
    />
    <meta property="og:image" content="/avatar.jpg" />
    <meta name="twitter:card" content="summary" />

    <script>
      try {
        var stored = localStorage.getItem('resume-theme')
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
